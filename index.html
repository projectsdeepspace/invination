<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#fff4ef" />
  <title>Открытка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- One lightweight font; you can remove if you want pure system fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <!--
  ЛОКАЛЬНЫЙ ЗАПУСК:
  - просто открой index.html в браузере (двойной клик).

  ДЕПЛОЙ НА GITHUB PAGES (БЕСПЛАТНО):
  1) Создай репозиторий на GitHub (например "alena-card")
  2) Загрузите туда 3 файла: index.html, styles.css, app.js
  3) Repo -> Settings -> Pages -> Deploy from a branch -> main / root -> Save
  4) Ссылка появится через минуту: https://<username>.github.io/alena-card/

  ДЕПЛОЙ НА NETLIFY (ЕЩЕ ПРОЩЕ):
  1) зайди netlify.com -> Add new site -> Deploy manually
  2) перетащи папку с этими файлами (где лежит index.html)
  3) получишь ссылку мгновенно
  -->

  <div class="bg" aria-hidden="true">
    <div class="petal-field" id="ambientPetals"></div>
    <div class="sparkles" id="ambientSparkles"></div>
  </div>

  <main class="wrap">
    <section class="card" aria-label="Интерактивная открытка">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">✈️</span>
          <span class="brandText">mini quest</span>
        </div>
        <button class="iconBtn" id="toggleMotion" type="button" aria-label="Переключить анимации">
          <span aria-hidden="true">✨</span>
        </button>
      </header>

      <div class="stage" id="stage" aria-live="polite"></div>

      <footer class="footer">
        <div class="dots" aria-hidden="true">
          <span class="dot" id="d1"></span>
          <span class="dot" id="d2"></span>
          <span class="dot" id="d3"></span>
          <span class="dot" id="d4"></span>
          <span class="dot" id="d5"></span>
          <span class="dot" id="d6"></span>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </footer>
    </section>
  </main>

  <div id="fxLayer" class="fxLayer" aria-hidden="true"></div>

  <script src="./app.js"></script>
</body>
</html>
